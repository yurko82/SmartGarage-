project:
  name: SmartGarage
  version: 0.1.9
llm:
  provider: openrouter
  model: google/gemini-2.5-flash
  fallback_model: openai/gpt-4o-mini
  api_base: https://openrouter.ai/api/v1
  api_key: '' # Ключ API налаштовується виключно через .env (OPENROUTER_API_KEY)
  temperature: 0
  max_tokens: 700
  timeout: 8
  max_retries: 2
  retry_backoff: 1.0
  daily_budget_usd: 1.00
  provider_preferences:
    data_collection: deny
    allow_fallbacks: true
local_llm:
  enabled: true
  provider: ollama
  model: qwen2.5-coder:1.5b
  api_base: http://localhost:11434
memory:
  path: ./memory
logs:
  path: ./logs
esp32:
  enabled: true
  host: 192.168.100.114
  port: 80
server:
  host: 0.0.0.0
  port: 8000
projector:
  enabled: true
  name: HY350MAX
  ip: 192.168.100.191
  airplay_port: 57000
  rest_port: 8899
  dlna_port: 39235
  dlna_uuid: 86257d31-b925-3e7f-9a41-b9ac6b4e0d1a
  primary_protocol: airplay
  auto_discover: true
admin:
  pin: '7777'
telegram:
  enabled: true
  bot_token: ''
  admin_chat_id: 464515219
  admin_pin: '7777'
  notify_presence: true
  notify_door: true
presence:
  rpa_continuity_window_sec: 90
  rpa_continuity_rssi_tolerance: 10
voice:
  enabled: true
  wake_word: "hey_jarvis"
  wake_word_threshold: 0.55
  whisper_model: "base"
  whisper_language: "uk"
  max_record_sec: 8.0
  silence_timeout_sec: 1.3
  virtual_source_name: "pipewire-virtual-source"
  api_endpoint: "http://127.0.0.1:5000/api/voice/command"
tts:
  enabled: true
  provider: edge # edge | heygen | elevenlabs
  model: edge # edge | heygen-voice-1-turbo-free | eleven_flash_v2_5
  voice_id: uk-UA-PolinaNeural # uk-UA-PolinaNeural | uk-UA-OstapNeural | або ID з провайдера
  language: uk
  rate: "+0%"
  timeout_seconds: 10.0
  max_text_length: 500
  max_retries: 2
  fallback_provider: edge
  cache_ttl_seconds: 3600
  max_cache_items: 100
  # API-ключі (HEYGEN_API_KEY, ELEVENLABS_API_KEY) налаштовуються виключно через .env

mqtt:
  enabled: true
  broker_host: "127.0.0.1"
  broker_port: 1883
  username: "smartgarage"
  password: "YOUR_MQTT_PASSWORD"
  discovery_prefix: "homeassistant"
  topic_prefix: "smartgarage"
  client_id: "smartgarage_bridge"
