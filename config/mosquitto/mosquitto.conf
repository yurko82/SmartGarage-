# Eclipse Mosquitto MQTT Configuration for Smart Garage & Home Assistant
# Standard MQTT listener (ESP32, HA, AI Bridge)
listener 1883
protocol mqtt
allow_anonymous true

# WebSockets listener for Web Dashboards & UI
listener 9001
protocol websockets
allow_anonymous true

# Persistence: store retained discovery and LWT messages
persistence true
persistence_location /mosquitto/data/

# Logging configuration
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
