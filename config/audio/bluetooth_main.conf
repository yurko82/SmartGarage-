# /etc/bluetooth/main.conf - Smart Garage Bluetooth Audio Optimization

[General]
# Enable audio endpoints and socket plugins
Enable=Source,Sink,Media,Socket

# Disable low-quality telephony headset profiles (mSBC / CVSD gateway)
Disable=HeadsetGateway,mSBC

# General BlueZ Settings
Name = SmartGarage-Audio
Class = 0x20041C
DiscoverableTimeout = 0
PairableTimeout = 0
AutoConnectTimeout = 120
FastConnectable = true
JustWorksRepairing = always

[CodecConfig]
# Enforce High-Quality SBC-XQ and A2DP codecs
SBCSources=1
A2DPSources=1
SBCXQSources=1

[Policy]
AutoEnable=true
ResumeDelay=2
